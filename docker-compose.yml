services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mongodb+srv://buildcare:buildcare@cluster0.5hno2fn.mongodb.net/buildbridge?appName=Cluster0
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    ports:
      - "5000:5000"
    depends_on:

      redis:
        condition: service_healthy
    command: ["sh", "-c", "node dist/server.js"]

volumes:

  redis-data:
